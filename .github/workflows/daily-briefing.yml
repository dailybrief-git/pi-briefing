name: Daily briefing

on:
  schedule:
    # 00:00 Asia/Bangkok = 17:00 UTC.
    - cron: "0 17 * * *"
  workflow_dispatch: {}

# contents: write -> commit updated state (users/) back to main.
# GitHub Pages publishing has been RETIRED: the Lovable app (Arun Daily) is now
# the only dashboard, so the pages/id-token permissions, the site-assembly steps
# and the deploy job have all been removed.
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefings + send emails (all users)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-sonnet-5' }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PROFILE_URL: ${{ secrets.PROFILE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Each user is emailed at their OWN profile email (multi-user).
          # To temporarily force a single recipient (testing), set RESEND_TO.
          #
          # Email "Open dashboard" links now point to the Lovable app. Because
          # DASHBOARD_BASE_URL is no longer set, run_pipeline._dashboard_url_for
          # falls back to this single fixed URL for every user. The /dashboard
          # route resolves whichever user is logged in, so one URL fits all.
          DASHBOARD_URL: "https://your-daily-signal.lovable.app/dashboard"
          # Verified sending domain (mail.astudo.com). Delivers to any recipient.
          EMAIL_FROM: "Arun Daily <brief@mail.astudo.com>"
        run: python run_pipeline.py

      - name: Commit updated state back to main
        run: |
          git config user.name  "pi-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add users
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            git push
          fi

