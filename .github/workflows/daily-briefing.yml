name: Daily briefing

on:
  schedule:
    # 00:00 Asia/Bangkok = 17:00 UTC.
    - cron: "0 17 * * *"
  workflow_dispatch: {}

# contents: write  -> commit updated state (users/) back to main
# pages: write + id-token: write -> required by actions/deploy-pages (official
# GitHub Pages deploy). This replaces the old force-push to the gh-pages branch,
# which did not reliably trigger a Pages deployment.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefings + send emails (all users)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-sonnet-5' }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PROFILE_URL: ${{ secrets.PROFILE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Each user is emailed at their OWN profile email (multi-user).
          # To temporarily force a single recipient (testing), set RESEND_TO.
          DASHBOARD_BASE_URL: "https://dailybrief-git.github.io/pi-briefing"
          # Verified sending domain (mail.astudo.com). Delivers to any recipient.
          EMAIL_FROM: "Arun Daily <brief@mail.astudo.com>"
        run: python run_pipeline.py

      - name: Commit updated state back to main
        run: |
          git config user.name  "pi-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add users
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Assemble site (_site)
        run: |
          rm -rf _site && mkdir -p _site
          for d in users/*/ ; do
            name=$(basename "$d")
            [ -f "$d/dashboard_latest.html" ] || continue
            mkdir -p "_site/$name"
            cp "$d/dashboard_latest.html" "_site/$name/index.html"
            cp "$d"/dashboard_*.html "_site/$name/" 2>/dev/null || true
          done
          # Keep Anthony's existing root bookmark working.
          if [ -f users/anthony/dashboard_latest.html ]; then
            cp users/anthony/dashboard_latest.html _site/index.html
          fi
          # Publish the onboarding questionnaire at a shareable URL.
          if [ -f onboarding.html ]; then
            cp onboarding.html _site/onboarding.html
          fi
          # Plain static site: skip Jekyll processing.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
